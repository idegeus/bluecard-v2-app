<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
html,body{margin:0;width:1024px;height:500px;overflow:hidden}
body{background:radial-gradient(ellipse 70% 90% at 32% 45%,#1E7A5C 0%,#0F5A43 45%,#0A3D2E 100%);font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;position:relative}
body:after{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 30% 40%,rgba(255,255,255,.015) 0 1px,transparent 1px 3px);pointer-events:none}
.fan{position:absolute;left:70px;top:58px;width:420px;height:390px}
.card{position:absolute;width:150px;height:215px;border-radius:14px;background:#fff;box-shadow:0 10px 24px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.08);transform-origin:50% 120%;left:135px;top:70px}
.card .c{position:absolute;left:12px;top:8px;font-weight:800;font-size:34px;line-height:1;text-align:center}
.card .c small{display:block;font-size:28px}
.card .big{position:absolute;left:0;right:0;top:62px;text-align:center;font-size:92px;line-height:1}
.red{color:#D32F2F}.blk{color:#1B1B1B}
.back{background:linear-gradient(135deg,#1558B0,#0D3C7A);}
.back:before{content:"";position:absolute;inset:10px;border-radius:9px;border:2px solid rgba(255,255,255,.75);background:repeating-linear-gradient(45deg,rgba(255,255,255,.18) 0 3px,transparent 3px 12px),repeating-linear-gradient(-45deg,rgba(255,255,255,.18) 0 3px,transparent 3px 12px)}
.text{position:absolute;left:520px;top:110px;right:40px;color:#fff}
h1{margin:0;font-size:92px;font-weight:900;letter-spacing:-2px;text-shadow:0 4px 18px rgba(0,0,0,.35)}
.games{margin-top:6px;font-size:27px;font-weight:700;color:#FFD54F}
.tag{margin-top:22px;font-size:25px;line-height:1.35;color:#E3F2E9;font-weight:500}
.pill{display:inline-block;margin-top:24px;padding:9px 20px;border-radius:999px;background:rgba(0,0,0,.28);border:1.5px solid rgba(255,255,255,.35);font-size:20px;font-weight:600;color:#fff}
</style></head><body>
<div class="fan">
 <div class="card back" style="transform:rotate(-34deg)"></div>
 <div class="card" style="transform:rotate(-17deg)"><div class="c blk">A<small>♠</small></div><div class="big blk">♠</div></div>
 <div class="card" style="transform:rotate(0deg)"><div class="c red">10<small>♦</small></div><div class="big red">♦</div></div>
 <div class="card" style="transform:rotate(17deg)"><div class="c blk">K<small>♣</small></div><div class="big blk">♣</div></div>
 <div class="card" style="transform:rotate(34deg)"><div class="c red">2<small>♥</small></div><div class="big red">♥</div></div>
</div>
<div class="text">
 <h1>BlueCard</h1>
 <div class="games">Shithead · Crazy Eights · President · Hearts</div>
 <div class="tag">Play together, each on your own phone.<br>Over Bluetooth, no internet needed.</div>
 <div class="pill">Or play against clever bots</div>
</div>
</body></html>
